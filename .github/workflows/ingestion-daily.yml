name: Ingestion daily

# Daily collection, extraction, matching, scoring and budget-gated contact lookup of new items.
# The schedule ships DISABLED. Enable it only after approval (see docs/ingestion-runbook.md, "Enable the schedule").
on:
  # schedule:
  #   - cron: '23 11 * * *'   # 06:23 CDT / 05:23 CST
  workflow_dispatch:
    inputs:
      limit:
        description: Max items per source
        default: '20'
      max_spend:
        description: treg spend cap for this run in USD (can only lower TREG_BUDGET_USD)
        default: '0'

permissions:
  contents: read

concurrency:
  group: mando-cube-ingestion
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run daily plan
        env:
          PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
          PIPELINE_SUPABASE_KEY: ${{ secrets.PIPELINE_SUPABASE_KEY }}
          PIPELINE_ALLOW_REMOTE: ${{ vars.PIPELINE_ALLOW_REMOTE }}
          PIPELINE_CONTACT: ${{ vars.PIPELINE_CONTACT }}
          # Ollama is not available on hosted runners: structured signals only until a model host is chosen.
          PIPELINE_LLM: ${{ vars.PIPELINE_LLM || 'none' }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          TREG_BUDGET_USD: ${{ vars.TREG_BUDGET_USD || '0' }}
          PIPELINE_LEDGER: var/spend-ledger.jsonl
          LIMIT: ${{ inputs.limit || '20' }}
          MAX_SPEND: ${{ inputs.max_spend || '0' }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: node scripts/pipeline.mjs run --plan daily --limit "$LIMIT" --max-spend "$MAX_SPEND" --trigger "$TRIGGER"
