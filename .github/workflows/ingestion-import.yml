name: Ingestion import

# On-demand run for the dashboard's Import button: CSV rows go through matching and scoring.
# The button (or a person) dispatches this workflow with the CSV text; nothing runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      csv:
        description: CSV text (company, website, employees, source, quote, signal_type, signal_date)
        required: true

permissions:
  contents: read

concurrency:
  group: mando-cube-ingestion
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Import rows
        env:
          CSV: ${{ inputs.csv }}
          PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
          PIPELINE_SUPABASE_KEY: ${{ secrets.PIPELINE_SUPABASE_KEY }}
          PIPELINE_ALLOW_REMOTE: ${{ vars.PIPELINE_ALLOW_REMOTE }}
          PIPELINE_LLM: none
        run: |
          printf '%s' "$CSV" > import.csv
          node scripts/pipeline.mjs import import.csv --trigger import_button
