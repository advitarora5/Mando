name: Contact research

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mando-cube-contact-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CONTACT_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Research queued companies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          CONTACT_RESEARCH_MAX_COMPANIES: '5'
          CONTACT_RESEARCH_MAX_CONTACTS: '3'
          CONTACT_RESEARCH_MAX_RUN_USD: '1'
          CONTACT_RESEARCH_MAX_CALL_USD: '0.10'
        run: node scripts/run-contact-research.mjs --apply --trigger=schedule
